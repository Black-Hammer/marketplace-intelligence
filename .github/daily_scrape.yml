name: Daily Price Scrape

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC daily (09:00 WAT)
  workflow_dispatch:        # allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scraper
        run: python -m src.scraper.daily_run
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}

      - name: Commit updated price series
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/price_series.csv data/raw/
          git diff --cached --quiet || git commit -m "chore: daily price snapshot $(date +%F)"
          git push

